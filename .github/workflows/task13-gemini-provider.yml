name: Task 13 Gemini Provider Gate

on:
  push:
    branches:
      - feature/phase0-platform-bootstrap
    paths:
      - package.json
      - package-lock.json
      - .env.example
      - src/config.ts
      - src/agent/provider.ts
      - src/agent/fake-provider.ts
      - src/agent/providers/gemini.ts
      - src/agent/chat-renderer.ts
      - tests/agent/provider-config.test.ts
      - tests/agent/provider-capabilities.test.ts
      - tests/agent/providers/gemini.test.ts
      - tests/agent/chat-renderer.test.ts
      - tests/agent/decision-gate.test.ts
      - tests/agent/reasoning-isolation.test.ts
      - fixtures/provider/reasoning-isolation.json
      - .github/workflows/phase0.yml
      - .github/workflows/task12-reasoning-isolation.yml
      - .github/workflows/task13-gemini-provider.yml
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: task13-gemini-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run provider and reasoning boundary tests
        run: >-
          npm test --
          tests/agent/providers/gemini.test.ts
          tests/agent/provider-capabilities.test.ts
          tests/agent/provider-config.test.ts
          tests/agent/chat-renderer.test.ts
          tests/agent/decision-gate.test.ts
          tests/agent/reasoning-isolation.test.ts
      - name: Typecheck provider boundary
        run: npm run typecheck
