name: Task 9 Inventory Live

on:
  push:
    branches:
      - feature/phase0-platform-bootstrap
    paths:
      - src/minecraft/adapter.ts
      - src/minecraft/mineflayer-inventory.ts
      - src/skills/survival.ts
      - src/skills/inventory.ts
      - tests/minecraft/mineflayer-inventory.test.ts
      - tests/minecraft/inventory-live.e2e.test.ts
      - tests/skills/survival.test.ts
      - tests/skills/inventory.test.ts
      - scripts/fetch-test-server.ts
      - .github/workflows/task9-inventory-live.yml

permissions:
  contents: read

concurrency:
  group: task9-inventory-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Fetch verified Mojang test server
        run: npm run fetch:test-server
        env:
          MC_TEST_VERSION: '1.21.1'
      - name: Run live survival and inventory scenario
        run: npm test -- tests/minecraft/inventory-live.e2e.test.ts
        env:
          MC_INV_LIVE_E2E: '1'
          MC_TEST_VERSION: '1.21.1'
          MC_INV_TEST_PORT: '25573'
