name: Task 16 Soak and Chaos Harness Gate

on:
  push:
    branches:
      - feature/phase0-platform-bootstrap
    paths:
      - package.json
      - package-lock.json
      - README.md
      - scripts/soak.ts
      - scripts/chaos.ts
      - tests/scenarios/chaos.test.ts
      - docs/operations/pi-deployment.md
      - .github/workflows/phase0.yml
      - .github/workflows/task16-soak-chaos.yml
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: task16-soak-chaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak-chaos-harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run soak and chaos contract tests
        run: npm test -- tests/scenarios/chaos.test.ts
      - name: Run short process-only soak smoke
        env:
          MC_SOAK_DURATION_MS: '50'
          MC_SOAK_INTERVAL_MS: '10'
        run: npx tsx scripts/soak.ts > soak-smoke.json
      - name: Verify incomplete smoke cannot masquerade as hardware evidence
        run: >-
          node -e "const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync('soak-smoke.json','utf8')); if(d.summary.evidenceComplete!==false) throw new Error('process-only smoke must remain incomplete'); for(const s of ['pathfinderPlanningDurationMs','activeGoalAgeMs','eventQueueDepth','memoryRowCount','aiDecisionLatencyMs']) if(!d.summary.missingMetrics.includes(s)) throw new Error('missing explicit metric: '+s)"
      - name: Verify hardware gates remain explicitly pending
        run: >-
          node -e "const fs=require('node:fs'); const r=fs.readFileSync('README.md','utf8'); for(const s of ['Task 16 real deployment evidence','Linux ARM64 runtime measurements','Pi 3B benchmark','4–8 hour soak']) if(!r.includes(s)) throw new Error('missing pending gate statement: '+s)"
      - name: Typecheck harness
        run: npm run typecheck
