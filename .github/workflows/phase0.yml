name: Phase 0 Bootstrap

on:
  push:
    branches:
      - feature/phase0-platform-bootstrap
    paths:
      - package.json
      - package-lock.json
      - .env.example
      - tsconfig.json
      - scripts/**
      - src/**
      - tests/**
      - .github/workflows/phase0.yml
      - .github/workflows/task13-gemini-provider.yml
      - .github/workflows/task14-control-api.yml
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase0-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run platform probe
        run: npm run probe
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck

  live-observation:
    needs: phase0-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci
      - name: Fetch verified Mojang test server
        env:
          MC_TEST_VERSION: '1.21.1'
        run: npm run fetch:test-server
      - name: Run live observation-only scenario
        env:
          MC_LIVE_E2E: '1'
          MC_TEST_VERSION: '1.21.1'
          MC_TEST_PORT: '25570'
        run: npm test -- tests/minecraft/observation-live.e2e.test.ts
