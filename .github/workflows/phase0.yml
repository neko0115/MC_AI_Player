name: Phase 0 Bootstrap

on:
  push:
    branches:
      - feature/phase0-platform-bootstrap
    paths:
      - package.json
      - package-lock.json
      - tsconfig.json
      - scripts/**
      - tests/**
      - .github/workflows/phase0.yml
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  platform-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-${{ matrix.os }}
          path: package-lock.json
          if-no-files-found: error
      - name: Run platform probe test
        run: npm test -- tests/contracts/platform-probe.test.ts
      - name: Typecheck
        run: npm run typecheck
