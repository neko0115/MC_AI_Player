name: Phase 0 Bootstrap

on:
  push:
    branches:
      - feature/phase0-platform-bootstrap
    paths:
      - package.json
      - package-lock.json
      - tsconfig.json
      - scripts/**
      - src/**
      - tests/**
      - .github/workflows/phase0.yml
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase0-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run platform probe
        run: npm run probe
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
