name: Task 13 Lock Gemini SDK

on:
  push:
    branches:
      - feature/phase0-platform-bootstrap
    paths:
      - .github/workflows/task13-lock-genai.yml

permissions:
  contents: write

jobs:
  lock-gemini-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install exact Google GenAI SDK and update lockfile
        run: npm install --save-exact @google/genai@2.21.0
      - name: Probe SDK import and Interactions surface
        run: node --input-type=module -e "import { GoogleGenAI } from '@google/genai'; const client = new GoogleGenAI({apiKey:'probe-only-not-used'}); if (!client.interactions || typeof client.interactions.create !== 'function') throw new Error('Interactions API missing'); console.log(JSON.stringify({sdk:'@google/genai', interactions:true, node:process.version, arch:process.arch}))"
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit canonical package files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package changes to commit"
            exit 0
          fi
          git commit -m "chore: lock Google GenAI SDK dependency"
          git push origin "HEAD:${GITHUB_REF_NAME}"
