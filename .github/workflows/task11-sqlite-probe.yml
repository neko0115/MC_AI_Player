name: Task 11 Memory Native Gate

on:
  push:
    branches:
      - feature/phase0-platform-bootstrap
    paths:
      - package.json
      - package-lock.json
      - src/memory/**
      - tests/memory/**
      - scripts/probe-sqlite-driver.mjs
      - .github/workflows/task11-sqlite-probe.yml

permissions:
  contents: read

concurrency:
  group: task11-memory-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            arch: x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            arch: arm64
    name: memory-native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked project dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Probe locked native sqlite load and round trip
        run: node scripts/probe-sqlite-driver.mjs
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
      - name: Run persistent memory repository tests
        run: npm test -- tests/memory/repository.test.ts tests/memory/restart.test.ts
      - name: Typecheck repository contracts
        run: npm run typecheck
