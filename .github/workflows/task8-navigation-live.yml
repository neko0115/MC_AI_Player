name: Task 8 Navigation Live

on:
  push:
    branches:
      - feature/phase0-platform-bootstrap
    paths:
      - src/minecraft/adapter.ts
      - src/minecraft/mineflayer-adapter.ts
      - src/skills/navigation.ts
      - tests/minecraft/navigation-pathfinder.test.ts
      - tests/minecraft/navigation-live.e2e.test.ts
      - tests/skills/navigation.test.ts
      - scripts/fetch-test-server.ts
      - .github/workflows/task8-navigation-live.yml

permissions:
  contents: read

concurrency:
  group: task8-navigation-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Fetch verified Mojang test server
        run: npm run fetch:test-server
        env:
          MC_TEST_VERSION: '1.21.1'
      - name: Run bounded navigation smoke
        run: npm test -- tests/minecraft/navigation-live.e2e.test.ts
        env:
          MC_NAV_LIVE_E2E: '1'
          MC_TEST_VERSION: '1.21.1'
          MC_NAV_TEST_PORT: '25571'
          MC_NAV_DURATION_SCALE: '0.02'
          MC_NAV_MIN_SEQUENCE_MS: '30000'
      - name: Run ten-minute navigation scenario
        run: npm test -- tests/minecraft/navigation-live.e2e.test.ts
        env:
          MC_NAV_LIVE_E2E: '1'
          MC_TEST_VERSION: '1.21.1'
          MC_NAV_TEST_PORT: '25572'
          MC_NAV_DURATION_SCALE: '1'
          MC_NAV_MIN_SEQUENCE_MS: '600000'
